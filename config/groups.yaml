# 대시보드 국가군·중점 산업·한글 표기 설정
# 국가군 구성은 여기서 수정하면 다음 빌드부터 반영된다.

top_n_by_value_added: 20      # 주요국 비교 = TiVA 부가가치(VALU, 전 산업) 기준 상위 N개 경제

regions:
  EU:
    label: EU 제조업
    official_aggregate: EU27_2020
    default_activity: C
    members: [AUT, BEL, BGR, HRV, CYP, CZE, DNK, EST, FIN, FRA, DEU, GRC, HUN, IRL, ITA, LVA, LTU,
              LUX, MLT, NLD, POL, PRT, ROU, SVK, SVN, ESP, SWE]
  MIDEAST:
    label: 중동
    default_activity: _T
    note: TiVA 2025년판에 포함된 중동 경제와 인접한 이집트, 튀르키예를 포함합니다.
    members: [ISR, JOR, SAU, ARE, TUR, EGY]
  SOUTHAM:
    label: 남미
    default_activity: _T
    note: 멕시코와 코스타리카는 북미·중미로 분류해 제외했습니다.
    members: [ARG, BRA, CHL, COL, PER]
  ASIA:
    label: 아시아
    official_aggregate: ASEAN
    default_activity: _T
    subgroups:
      동아시아: [CHN, HKG, JPN, KOR, TWN]
      동남아시아: [BRN, KHM, IDN, LAO, MYS, MMR, PHL, SGP, THA, VNM]
      남아시아: [BGD, IND, PAK]
      중앙아시아: [KAZ]
    members: [CHN, HKG, JPN, KOR, TWN, BRN, KHM, IDN, LAO, MYS, MMR, PHL, SGP, THA, VNM, BGD, IND, PAK, KAZ]

korea:
  code: KOR
  peers: [JPN, CHN, TWN, DEU, USA]

# 중점 산업. TiVA 산업분류(ISIC Rev.4 기반)에서 해당 산업을 포함하는 코드로 대응시킨다.
focus_industries:
  - code: C26
    label: 반도체·전자
    note: 컴퓨터·전자·광학기기(ISIC 26) 전체 값입니다. 반도체(ISIC 261)만 따로 분리되지 않습니다.
  - code: C27
    label: 이차전지·전기장비
    note: 전기장비(ISIC 27) 전체 값입니다. 축전지(ISIC 272)만 따로 분리되지 않으며, 양극재 등 소재는 C20, 비철금속 제련은 C24B에 속합니다.
  - code: C19
    label: 정유
    note: 코크스·석유정제품(ISIC 19) 전체 값입니다.
  - code: C301
    label: 조선
    note: 선박 건조(ISIC 301) 값입니다. 보트 건조를 포함합니다.
  - code: C29
    label: 자동차
    note: 자동차·트레일러(ISIC 29) 전체 값입니다.
  - code: C20
    label: 화학
    note: 화학물질·화학제품(ISIC 20) 전체 값입니다. 이차전지 소재 일부를 포함합니다.

