# OECD TiVA 수집 설정
# 지표·산업·국가 코드는 "Guide to OECD Trade in Value Added (TiVA) Indicators, 2025 edition" 기준.
# dataflow 위치와 차원 순서는 실행 시 OECD SDMX API에서 자동으로 확인한다.
# 2025년판 API는 비중 지표를 UNIT_MEASURE로 구분하고, 원천국별 부가가치는 EXGRVA dataflow에 있다.

source:
  base_url: https://sdmx.oecd.org/public/rest   # TiVA dataflow는 여기서 /sti-public/rest로 외부 참조된다
  agency: OECD.STI.PIE
  flow_keyword: TIVA              # dataflow id에 이 문자열이 들어간 것만 탐색
  min_request_interval_sec: 6     # 요청 사이 최소 간격 (OECD API 사용량 제한 대응)
  max_obs_per_query: 250000       # 한 번의 요청에서 받을 관측치 상한 추정값, 초과 시 자동 분할
  max_key_length: 1800            # URL 키 길이 상한, 초과 시 자동 분할
  timeout_sec: 600
  max_retries: 10

codes:
  world: W
  rest_of_world: WXD
  total_activity: _T
  manufacturing: C
  # 80개 개별 경제 + 기타 세계(WXD)
  economies: [
    AUS, AUT, BEL, CAN, CHL, COL, CRI, CZE, DNK, EST, FIN, FRA, DEU, GRC, HUN, ISL, IRL, ISR, ITA,
    JPN, KOR, LVA, LTU, LUX, MEX, NLD, NZL, NOR, POL, PRT, SVK, SVN, ESP, SWE, CHE, TUR, GBR, USA,
    AGO, ARG, BGD, BLR, BRA, BRN, BGR, KHM, CMR, CHN, CIV, HRV, CYP, COD, EGY, HKG, IND, IDN, JOR,
    KAZ, LAO, MYS, MLT, MAR, MMR, NGA, PAK, PER, PHL, ROU, RUS, STP, SAU, SEN, SGP, ZAF, TWN, THA,
    TUN, UKR, ARE, VNM, WXD
  ]
  # TiVA가 직접 제공하는 지역 집계 (있는 것만 수집)
  aggregates: [W, EU27_2020, OECD, ASEAN, G20, APEC]

activities:
  detail: [
    A01, A02, A03, B05, B06, B07, B08, B09,
    C10T12, C13T15, C16, C17_18, C19, C20, C21, C22, C23, C24, C25, C26, C27, C28, C29,
    C301, C302T309, C31T33,
    D, E, F, G, H49, H50, H51, H52, H53, I, J58T60, J61, J62_63, K, L, M, N, O, P, Q, R, S, T
  ]
  aggregates: [_T, A, B, C, BTE, D_E, F, GTT]
  partner: [_T, C, C26, C27, C19, C301, C29, C20]   # 상대국별 분석 산업 (전 산업, 제조업, 중점 산업)

years:
  partner_benchmark: [2000, 2005, 2010, 2015]
  partner_recent: 5                 # 최신 연도부터 거슬러 올라간 연도 수

# 수집 블록. dims에는 각 dataflow의 차원 id별로 코드나 코드 묶음 이름을 적는다.
# 적지 않은 차원은 전체를 받는다. years는 all(전체 기간) 또는 partner(상대국 분석 연도).
blocks:
  # 국가 × 산업 수준값 (상대국 = 세계, 백만 달러)
  levels:
    flow: MAINLV
    years: all
    dims:
      MEASURE: [EXGR, IMGR, EXGR_INT, EXGR_DVA, EXGR_FVA, VALU, FFD_DVA, DFD_FVA]
      REF_AREA: [economies, aggregates]
      ACTIVITY: [detail, aggregates]
      COUNTERPART_AREA: [W]

  # 국가 × 산업 비중 (총수출 대비 %, UNIT_MEASURE=PT_EXGR 우선)
  # EXGR_DVA = 국내부가가치 비중, EXGR_FVA = 후방 참여율, FEXGR_DVA = 전방 참여율(전 산업).
  # FEXGR_DVA의 산업별 값은 '외국의 해당 산업 수출'에 체화된 자국 부가가치이므로 점검용으로만 쓴다.
  shares:
    flow: MAINSH
    years: all
    dims:
      MEASURE: [EXGR_DVA, EXGR_FVA, FEXGR_DVA]
      REF_AREA: [economies, aggregates]
      ACTIVITY: [detail, aggregates]
      COUNTERPART_AREA: [W]
    rename: {EXGR_DVA: EXGR_DVASH, EXGR_FVA: EXGR_FVASH, FEXGR_DVA: EXGR_DVAFXSH}
    preferred_unit: PT_EXGR

  # 원천 산업 기준 전방 연계 (Koopman et al. 2010의 IV). 원천 경제·산업의 부가가치가 각 수출 경제의 전체 수출에
  # 체화된 크기를 받아, 받는 즉시 자국을 뺀 제3국 합계(FOREIGN)로 줄여 저장한다. (EXGRVA의 세계 W 항목은 0으로 비어 있음)
  forward_source:
    flow: EXGRVA
    years: all
    max_obs: 400000
    dims:
      VALUE_ADDED_SOURCE_AREA: [economies]
      VALUE_ADDED_SOURCE_ACTIVITY: [detail, aggregates]
      EXPORTING_AREA: [economies]
      EXPORTING_ACTIVITY: [_T]
    reduce: {source: VALUE_ADDED_SOURCE_AREA, exporter: EXPORTING_AREA}

  # 수출 대상국별 총수출과 최종수요 부가가치
  destination:
    flow: MAINLV
    years: partner
    dims:
      MEASURE: [EXGR, FFD_DVA]
      REF_AREA: [economies]
      ACTIVITY: [partner]
      COUNTERPART_AREA: [economies]

  # 원천 경제별 부가가치 (후방). 수출 경제 × 수출 산업의 총수출에 들어간 원천 경제의 부가가치
  origin_backward:
    flow: EXGRVA
    years: partner
    dims:
      VALUE_ADDED_SOURCE_AREA: [economies]
      VALUE_ADDED_SOURCE_ACTIVITY: [_T]
      EXPORTING_AREA: [economies]
      EXPORTING_ACTIVITY: [partner]

  # 원천 산업의 부가가치가 상대 경제 수출에 체화된 크기 (전방)
  origin_forward:
    flow: EXGRVA
    years: partner
    dims:
      VALUE_ADDED_SOURCE_AREA: [economies]
      VALUE_ADDED_SOURCE_ACTIVITY: [partner]
      EXPORTING_AREA: [economies]
      EXPORTING_ACTIVITY: [_T]
